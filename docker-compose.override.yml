# Локальная разработка: dev-образы (Dockerfile.dev), hot-reload, тома, dev-порт клиента.
#
# Docker Compose подхватывает этот файл АВТОМАТИЧЕСКИ при локальном `docker compose up`
# и объединяет с docker-compose.yml. На облачном деплое (Timeweb Cloud) файла нет
# (он в .gitignore), поэтому туда уходит только production-конфигурация.

services:
  db:
    volumes:
      - db_data:/var/lib/mysql

  server:
    build:
      dockerfile: Dockerfile.dev
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run start:dev"
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      dockerfile: Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://server:3000
    ports: !override
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  db_data:
